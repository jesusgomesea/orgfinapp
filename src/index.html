<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>org-fin</title>
    <base href="/" />
    <!-- viewport-fit=cover + safe-area no CSS: no iPhone o app ocupa a tela toda sem ficar embaixo do entalhe. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <!-- Fonte Geist (Google Fonts); sem internet cai na fonte do sistema. O service worker guarda após a 1ª visita. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" />
    <!-- iOS: abrir em tela cheia quando adicionado à Tela de Início -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="org-fin" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="icon" type="image/png" href="icons/icon-96x96.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Ative o JavaScript para usar o org-fin.</noscript>
  </body>
</html>
